<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — Spotix Admin</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #6b2fa5;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    img { height: 48px; width: auto; margin-bottom: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0; color: rgba(255,255,255,0.75); font-size: 0.95rem; }
    button {
      margin-top: 24px;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      background: #fff;
      color: #6b2fa5;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icons/logo-cropped.png" alt="Spotix" />
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
